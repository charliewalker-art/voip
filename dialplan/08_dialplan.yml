---

# =====================================================================
# Déploiement du dialplan final Asterisk (extensions.conf + internal.conf)
#
# MISE À JOUR IMPORTANTE : la structure du dialplan a évolué depuis
# l'écriture initiale de ce rôle. extensions.conf ne contient plus le
# dialplan lui-même - juste un "#include internal.conf". Le vrai
# contenu (contexte "internal", pas "from-internal"/"ivr-entry") vit
# maintenant dans internal.conf, avec les menus IVR 900/960/961/970
# déclarés individuellement (plus de pattern générique _9XX - conséquence
# du système de contextes dynamiques mis en place entre-temps).
#
# Ce fichier est la pièce centrale qui RELIE tous les rôles précédents :
#   - [internal] _1XXX : appels internes, facturés via A2Billing
#     (AGI a2billing.php, rôle 06), avec fallback messagerie vocale
#     (rôle 02, voicemail.conf) et limite de durée configurable
#     (get-setting.agi + reset-stale-inuse.agi, rôle 05)
#   - [internal] _3XXX : conférences ConfBridge (conference-entry.agi,
#     rôle 05 + confbridge.conf, rôle 07)
#   - [internal] 900/960/961/970 : IVR dynamique (ivr-dynamic.agi, rôle 05,
#     pilotée par les données ivr_menus/ivr_options/ivr_services, rôle 03)
#
# Restart/reload : d'après la carte validée en audit (section 6),
# "dialplan reload" suffit - pas de restart complet nécessaire.
# =====================================================================
- name: Déploiement du dialplan final Asterisk (extensions.conf + internal.conf)
  hosts: all
  become: true

  tasks:

    # ---------------------------------------------------------------
    # 1. Copie de extensions.conf (fichier minimal, #include uniquement)
    # ---------------------------------------------------------------
    - name: Copier /etc/asterisk/extensions.conf
      copy:
        src: files/extensions.conf
        dest: /etc/asterisk/extensions.conf
        owner: asterisk
        group: asterisk
        mode: '0644'
        backup: yes
      register: extensions_conf_copy

    # ---------------------------------------------------------------
    # 2. Copie de internal.conf (le vrai contenu du dialplan)
    # ---------------------------------------------------------------
    - name: Copier /etc/asterisk/internal.conf
      copy:
        src: files/internal.conf
        dest: /etc/asterisk/internal.conf
        owner: asterisk
        group: asterisk
        mode: '0644'
        backup: yes
      register: internal_conf_copy

    # ---------------------------------------------------------------
    # 3. Reload du dialplan (pas de restart complet nécessaire)
    # ---------------------------------------------------------------
    - name: Recharger le dialplan
      command: /usr/sbin/asterisk -rx "dialplan reload"
      register: dialplan_reload
      changed_when: true

    - name: Petite pause pour laisser le dialplan se recharger
      pause:
        seconds: 2

    # ---------------------------------------------------------------
    # 4. Vérifications finales
    # ---------------------------------------------------------------
    - name: Vérifier le contexte internal (contient tout : _1XXX, _3XXX, 900/960/961/970)
      command: /usr/sbin/asterisk -rx "dialplan show internal"
      register: internal_context_check
      changed_when: false

    - name: Compter le nombre total de contextes chargés
      command: /usr/sbin/asterisk -rx "dialplan show"
      register: dialplan_full_check
      changed_when: false

    - name: Afficher le résumé du déploiement du dialplan
      debug:
        msg:
          - "--- Contexte internal (_1XXX facturé A2Billing, _3XXX ConfBridge, 900/960/961/970 IVR) ---"
          - "{{ internal_context_check.stdout }}"
          - "Dialplan rechargé avec succès. Le système VoIP est maintenant entièrement connecté :"
          - "  - Appels internes 1001/1002/1003 -> facturation A2Billing en temps réel"
          - "  - Fallback automatique vers messagerie vocale si occupé/injoignable"
          - "  - Conférences 3000 (libre) / 3001 (PIN 1234, facturée) via _3XXX"
          - "  - Menus IVR 900/960/961/970 (déclarés individuellement, plus de pattern _9XX générique)"
          - "Prochaine étape : rôle 09_restart_and_verify.yml (restart complet + tests bout en bout : appel réel, IVR, conférence)."